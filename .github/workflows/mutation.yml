name: Mutation

# Weekly Stryker mutation testing over the commerce domain (money paths).
# Unit specs only — no Postgres/Redis/MinIO services required. The break
# threshold lives in apps/server/stryker.config.json.

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC = 09:00 ICT
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Stryker (commerce)
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves DATABASE_URL even for offline `prisma generate`
      DATABASE_URL: postgresql://postgres:password@localhost:5432/sales_copilot_dev?schema=public
      NODE_OPTIONS: --experimental-vm-modules
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Mutation test (commerce domain)
        run: pnpm --filter @sales-copilot/server exec stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: error
