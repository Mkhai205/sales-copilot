services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sales_copilot_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sales_copilot_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sales_copilot_net

  redis:
    image: redis:8.6-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sales_copilot_net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword123}
    ports:
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales_copilot_net

  db-migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: npx prisma migrate deploy --schema=apps/server/prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-sales_copilot_dev}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sales_copilot_net

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-sales_copilot_dev}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword123}
      STORAGE_BUCKETS: sales-copilot
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:-sales_copilot_access_token_secret_32_chars_min!}
      JWT_ACCESS_TOKEN_EXPIRES_IN_SECONDS: 900
      REFRESH_TOKEN_EXPIRES_IN_SECONDS: 604800
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost}
      FB_APP_ID: ${FB_APP_ID:-}
      FB_APP_SECRET: ${FB_APP_SECRET:-}
      FB_VERIFY_TOKEN: ${FB_VERIFY_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - sales_copilot_net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    environment:
      PORT: 3000
      NODE_ENV: production
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://server:8000/api/v1}
    depends_on:
      - server
    networks:
      - sales_copilot_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./config/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - server
      - web
    networks:
      - sales_copilot_net
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    volumes:
      - ./config/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./config/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - nginx
      - minio
    networks:
      - sales_copilot_net
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  sales_copilot_net:
    driver: bridge
