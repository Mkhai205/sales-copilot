# Cloudflare Tunnel configuration for Sales Copilot
# Replace <TUNNEL_ID> with your actual tunnel ID from setup-tunnel script
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: api.sales-copilot.kakadev.xyz
    service: http://host.docker.internal:8000
  - hostname: app.sales-copilot.kakadev.xyz
    service: http://host.docker.internal:3000
  - hostname: storage.sales-copilot.kakadev.xyz
    service: http://minio:9000
  - service: http_status:404
